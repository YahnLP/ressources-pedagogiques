site_name: "Électronique – Bac Pro CIEL (E2)"
site_description: "Cours, TP et annexes du module E2 – Bac Pro CIEL (Seconde, Première, Terminale) – Yahn Le Prettre"
site_url: "https://yahnlp.github.io/ressources-pedagogiques/"
site_author: "Yahn Le Prettre"
repo_url: "https://github.com/YahnLP/ressources-pedagogiques"
edit_uri: "edit/main/docs/"

copyright: |
  © Yahn LE PRETTRE, Enseignant à la MFR de Pontonx ·
  <a rel="license" href="https://creativecommons.org/licenses/by-nc-sa/4.0/deed.fr">Licence CC BY-NC-SA 4.0</a>

  · Hébergé sur GitHub Pages

docs_dir: docs

theme:
  name: material
  language: fr
  font: false            # pas de police Google (RGPD)
  logo: images/logo.svg
  favicon: images/logo.svg
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: cyan
      toggle:
        icon: material/weather-sunny
        name: "Passer au mode nuit"
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: cyan
      toggle:
        icon: material/weather-night
        name: "Passer au mode jour"
  features:
    - navigation.tabs
    - navigation.indexes
    - navigation.top
    - navigation.instant
    - toc.follow
    - content.code.copy
    - search.highlight
    - search.suggest
    - navigation.footer
    - content.tabs.link

plugins:
  - search:
      lang: fr
  - awesome-pages
  - callouts

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - def_list
  - footnotes
  - tables
  - toc:
      permalink: false
      toc_depth: 3
  - pymdownx.details
  - pymdownx.caret
  - pymdownx.mark
  - pymdownx.tilde
  - pymdownx.keys
  - pymdownx.inlinehilite
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

extra_css:
  - xtra/extra.css

extra_javascript:
  - xtra/extra.js
